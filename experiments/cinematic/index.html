<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cinematic Gwangju — 손으로 부르는 광주 (시안)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="cinematic.css?v=4">
</head>
<body>
  <!-- 왼쪽: 시네마틱 도시 풍경 (사진 한 장 + 등급 보정 오버레이 + 느린 카메라) -->
  <section class="stage" id="stage" aria-label="광주 도심 풍경">
    <div class="hero" id="hero">
      <div class="plx" id="hero-plx"><img class="hero-img" id="hero-img" alt="" draggable="false"></div>
      <div class="grade" aria-hidden="true"></div>
    </div>
    <div class="scene" id="scene" aria-hidden="true">
      <div class="plx" id="scene-plx"><img class="scene-img" id="scene-img" alt="" draggable="false"></div>
      <div class="grade" aria-hidden="true"></div>
    </div>
    <div class="glow" id="glow" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <!-- 사진이 없을 때(저장소에는 사진을 넣지 않는다) -->
    <div class="no-photo" id="no-photo" hidden>
      <p><b>배경 사진이 없습니다.</b><br>사용 권한을 확인한 사진을 <code>assets/</code>에 넣어주세요 (README 참고).</p>
    </div>

    <!-- 상단 -->
    <header class="top">
      <div class="brand">
        <b>손으로 부르는 광주</b>
        <span>GWANGJU SIGN LANGUAGE MAP · CINEMATIC 시안</span>
      </div>
      <button type="button" class="explore-btn" id="explore-btn" aria-expanded="false" aria-controls="explore-menu">지역 선택 <span class="plus" aria-hidden="true">+</span></button>
    </header>

    <nav class="explore-menu" id="explore-menu" hidden aria-label="장소 선택">
      <div class="em-head"><span>EXPLORE — 광주 동구</span><button type="button" class="em-close" id="explore-close">닫기 ✕</button></div>
      <div class="em-list" id="explore-list"></div>
      <p class="em-note">사진 속 위치는 확인되지 않아 사진 위에 핀을 두지 않습니다. 실제 위치는 <a id="map-link" href="../../#map/chungjang-ro">지명 수어 지도</a>에서 봅니다.</p>
    </nav>

    <!-- 큰 타이포그래피: 손글씨 한 줄(기록 원문) + 장소 이름 -->
    <div class="title-block" id="title-block">
      <p class="hand" id="hand"></p>
      <h1 class="place" id="place-title"></h1>
      <svg class="rule" viewBox="0 0 320 24" aria-hidden="true"><path id="rule-path" d="M2 12 C 90 4, 180 20, 318 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <p class="eyebrow" id="eyebrow"></p>
    </div>

    <!-- 하단 장소 탐색 -->
    <nav class="spot-menu" id="spot-menu" aria-label="주요 장소"></nav>

    <p class="credit" id="credit"></p>
  </section>

  <!-- 오른쪽: 황금색 기록 패널 (모바일은 바텀시트) -->
  <aside class="panel" id="panel" hidden tabindex="-1" role="region" aria-label="선택한 장소의 수어 기록">
    <button type="button" class="sheet-handle" id="sheet-handle" aria-label="시트 펼치기" aria-expanded="false"><span aria-hidden="true"></span></button>
    <header class="p-head">
      <div class="p-nav">
        <button type="button" class="circ" id="p-prev" aria-label="이전 장소"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="circ" id="p-next" aria-label="다음 장소"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <button type="button" class="circ" id="p-close" aria-label="패널 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    </header>
    <div class="p-title">
      <p class="p-en" id="p-en"></p>
      <h2 id="p-name"></h2>
      <p class="p-sub" id="p-sub"></p>
    </div>
    <div class="p-body" id="p-body"></div>
    <footer class="p-foot">
      <p class="p-attrib">기록 원문: data/places.json · data/spots.json (변경 없음) · 사진: 내부 시안용 참고 이미지</p>
    </footer>
  </aside>

  <script src="cinematic.js?v=2"></script>
</body>
</html>
