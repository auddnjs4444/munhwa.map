<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>3D 탐험 프로토타입 — 손으로 부르는 광주</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="city3d.css?v=3">
</head>
<body>
  <!-- 하늘: 지도 캔버스는 투명하게 두고, 지평선 위로는 이 배경이 비친다 -->
  <div class="sky" aria-hidden="true"></div>
  <div id="map" role="application" aria-label="광주 동구 핵심 구간 3D 지도"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- 상단: 제목 + 탐험 버튼 -->
  <header class="top">
    <div class="brand">
      <b>손으로 부르는 광주</b>
      <span>3D 탐험 프로토타입 · 충장로 – 금남로 – 5·18민주광장 – ACC</span>
    </div>
    <button type="button" class="explore-btn" id="explore-btn" aria-expanded="false" aria-controls="explore-menu">탐험 <span class="plus" aria-hidden="true">+</span></button>
  </header>

  <!-- 탐험 메뉴: 핵심 축의 스팟 목록 (왼쪽 긴 동 목록 대신) -->
  <nav class="explore-menu" id="explore-menu" hidden aria-label="스팟 선택">
    <div class="em-head"><span>EXPLORE — 핵심 축</span><button type="button" class="em-close" id="explore-close">닫기 ✕</button></div>
    <div class="em-list" id="explore-list"></div>
    <p class="em-note" id="explore-note"></p>
  </nav>

  <!-- 하단 스팟 내비게이션 -->
  <nav class="spot-nav" id="spot-nav" aria-label="핵심 스팟"></nav>

  <!-- 안내 (데이터 로드 실패 등) -->
  <div class="notice" id="notice" hidden role="status"></div>

  <!-- 오른쪽 패널 / 모바일 시트 -->
  <aside class="panel" id="panel" hidden tabindex="-1" role="region" aria-label="선택한 장소의 기록">
    <button type="button" class="sheet-handle" id="sheet-handle" aria-label="시트 펼치기" aria-expanded="false"><span aria-hidden="true"></span></button>
    <header class="p-head">
      <div class="p-nav">
        <button type="button" class="circ" id="p-prev" aria-label="이전 장소"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="circ" id="p-next" aria-label="다음 장소"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <button type="button" class="circ" id="p-close" aria-label="패널 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </header>
    <div class="p-title">
      <span class="p-idx" id="p-idx"></span>
      <p class="p-kicker" id="p-kicker"></p>
      <h2 id="p-name"></h2>
      <p class="p-en" id="p-en"></p>
    </div>
    <div class="p-body" id="p-body"></div>
    <footer class="p-foot">
      <button type="button" class="p-next-btn" id="p-next-btn"></button>
      <p class="p-attrib">지도 데이터 © OpenStreetMap contributors (ODbL) · 건물 높이는 자료가 없으면 단순화 모델</p>
    </footer>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="city3d.js?v=5"></script>
</body>
</html>
