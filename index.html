<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>손으로 부르는 광주 — 수어 지도 (프로토타입)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --ink: #12262E;
    --teal-deep: #12333F;
    --paper: #F6F3EC;
    --line: #DCD5C6;
    --amber: #C77A2E;
    --muted: #6B6558;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--line);
  }
  header .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--amber);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  header h1 {
    font-family: Georgia, 'Noto Serif KR', serif;
    font-size: 28px;
    margin: 0 0 4px;
    color: var(--teal-deep);
  }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .layout {
    display: flex;
    gap: 20px;
    padding: 24px 32px 40px;
    max-width: 1100px;
    margin: 0 auto;
    flex-wrap: wrap;
  }
  #map {
    flex: 1.3 1 480px;
    min-width: 300px;
    height: 560px;
    border-radius: 14px;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  #detail {
    flex: 1 1 320px;
    min-width: 280px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
  }
  .card.empty { color: var(--muted); font-size: 14px; }
  .card h2 {
    margin: 0 0 10px;
    font-size: 20px;
    color: var(--teal-deep);
    font-family: Georgia, 'Noto Serif KR', serif;
  }
  .video-box {
    position: relative;
    background: var(--teal-deep);
    border-radius: 10px;
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .video-box iframe { width: 100%; height: 100%; border: 0; }
  .video-box .placeholder {
    font-size: 13px;
    opacity: 0.8;
    text-align: center;
    padding: 0 16px;
    line-height: 1.6;
  }
  .section-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 14px 0 4px;
  }
  .section-text { font-size: 14px; line-height: 1.7; margin: 0; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .tag {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: #EFE7D8;
    color: var(--teal-deep);
  }
  .filter-bar {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 32px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-bar .filter-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-right: 4px;
  }
  .chip {
    font-family: inherit;
    font-size: 13px;
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--teal-deep);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .chip:hover { border-color: var(--amber); }
  .chip:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .chip.active {
    background: var(--teal-deep);
    border-color: var(--teal-deep);
    color: #fff;
  }
  .sensitive-gate { text-align: center; padding: 26px 6px; }
  .sensitive-gate button {
    margin-top: 14px;
    background: var(--teal-deep);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .leaflet-popup-content { font-family: 'Pretendard', sans-serif; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0 30px; }
</style>
</head>
<body>
  <header>
    <p class="eyebrow">청년 ESG 문화실험실 · 개발용 프로토타입</p>
    <h1>손으로 부르는 광주</h1>
    <p>지도 위 핀을 눌러 광주의 수어 지명을 만나보세요. (예시 데이터 — 실제 인터뷰 콘텐츠로 교체 필요)</p>
  </header>
  <nav class="filter-bar" id="filter-bar" aria-label="세대·주제 필터" hidden>
    <span class="filter-label">세대·주제</span>
  </nav>
  <div class="layout">
    <div id="map"></div>
    <div id="detail"><div class="card empty">지도에서 핀을 눌러보세요.</div></div>
  </div>
  <footer>지도 데이터 &copy; OpenStreetMap contributors</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
