<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>손으로 부르는 광주 — 수어 지도 (프로토타입)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --ink: #12262E;
    --teal-deep: #12333F;
    --paper: #F6F3EC;
    --line: #DCD5C6;
    --amber: #C77A2E;
    --muted: #6B6558;
    --frame: #101416;
    --grid-line: #EAE4D6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: clamp(10px, 2.5vw, 28px);
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: var(--frame);
    color: var(--ink);
  }
  /* 설계 도면 시트 컨셉: 격자 종이 + 잉크 테두리 */
  .sheet {
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      var(--paper);
    background-size: 28px 28px, 28px 28px, auto;
    border: 1px solid var(--ink);
    min-height: calc(100vh - 2 * clamp(10px, 2.5vw, 28px));
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 16px 32px;
    border-bottom: 1px solid var(--ink);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--ink);
  }
  .logo-mark {
    border: 2px solid var(--ink);
    padding: 4px 9px;
    font-weight: 900;
    font-size: 16px;
  }
  .logo-text {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.06em;
    line-height: 1.2;
  }
  .logo-sub {
    display: block;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.28em;
    color: var(--muted);
    margin-top: 2px;
  }
  .org {
    margin: 0;
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-align: right;
  }

  .hero {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 52px 32px 6px;
  }
  .hero h1 {
    margin: 0 0 18px;
    font-size: clamp(38px, 6vw, 62px);
    line-height: 1.1;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .lede {
    margin: 0;
    max-width: 60ch;
    font-size: 15px;
    line-height: 1.7;
    color: var(--muted);
  }
  /* 치수선 모티프: 양 끝에 작은 노드가 달린 가는 선 */
  .rule {
    position: relative;
    height: 1px;
    background: var(--ink);
    margin-top: 28px;
  }
  .rule::before,
  .rule::after {
    content: '';
    position: absolute;
    top: -3.5px;
    width: 7px;
    height: 7px;
    border: 1px solid var(--ink);
    background: var(--paper);
  }
  .rule::before { left: 0; }
  .rule::after { right: 0; }

  .filter-bar {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 22px 32px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--muted);
    margin-right: 6px;
  }
  .chip {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 6px 14px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .chip:hover { box-shadow: 2px 2px 0 var(--ink); }
  .chip:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .chip.active {
    background: var(--ink);
    color: var(--paper);
  }

  .layout {
    width: 100%;
    display: flex;
    gap: 22px;
    padding: 26px 32px 44px;
    max-width: 1100px;
    margin: 0 auto;
    flex-wrap: wrap;
    flex: 1;
  }
  #map {
    flex: 1.3 1 480px;
    min-width: 300px;
    height: 560px;
    border: 1px solid var(--ink);
    background: #fff;
  }
  #detail {
    flex: 1 1 320px;
    min-width: 280px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--ink);
    padding: 24px 26px;
    box-shadow: 6px 6px 0 rgba(18, 38, 46, 0.08);
  }
  .card.empty { color: var(--muted); font-size: 14px; }
  .card h2 {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .video-box {
    position: relative;
    background: var(--teal-deep);
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .video-box iframe { width: 100%; height: 100%; border: 0; }
  .video-box .placeholder {
    font-size: 13px;
    opacity: 0.85;
    text-align: center;
    padding: 0 16px;
    line-height: 1.6;
  }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.16em;
    margin: 16px 0 4px;
  }
  .section-text { font-size: 14px; line-height: 1.75; margin: 0; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
  .tag {
    font-size: 11.5px;
    letter-spacing: 0.03em;
    padding: 3px 10px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
  }
  .sensitive-gate { text-align: center; padding: 28px 6px; }
  .sensitive-gate button {
    margin-top: 16px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    padding: 11px 22px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .sensitive-gate button:hover {
    background: var(--ink);
    color: var(--paper);
    box-shadow: 3px 3px 0 rgba(18, 38, 46, 0.25);
  }

  /* 지도 핀: 잉크색 도트, 선택 시 앰버 */
  .pin-wrap { background: transparent; border: none; }
  .pin {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--teal-deep);
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--teal-deep), 2px 2px 0 rgba(18, 38, 46, 0.2);
    transition: transform 0.12s, background 0.12s;
  }
  .pin:hover { transform: scale(1.2); }
  .pin--active {
    background: var(--amber);
    box-shadow: 0 0 0 1px var(--amber), 2px 2px 0 rgba(18, 38, 46, 0.2);
  }
  .leaflet-tooltip.place-tip {
    font-family: 'Pretendard', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--ink);
    border-radius: 0;
    box-shadow: 2px 2px 0 rgba(18, 38, 46, 0.15);
    padding: 4px 10px;
  }
  .leaflet-tooltip.place-tip::before { display: none; }
  .leaflet-bar { border-radius: 0; }
  .leaflet-bar a { border-radius: 0 !important; color: var(--ink); }

  footer {
    border-top: 1px solid var(--ink);
    padding: 14px 32px 16px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="sheet">
    <header class="topbar">
      <a class="logo" href="./">
        <span class="logo-mark">손</span>
        <span class="logo-text">광주 수어 지도
          <span class="logo-sub">GWANGJU SIGN LANGUAGE MAP</span>
        </span>
      </a>
      <p class="org">청년 ESG 문화실험실<br>개발용 프로토타입</p>
    </header>

    <section class="hero">
      <h1>손으로 부르는,<br>광주의 이름들</h1>
      <p class="lede">지도 위 핀을 눌러 광주의 수어 지명을 만나보세요. (예시 데이터 — 실제 인터뷰 콘텐츠로 교체 필요)</p>
      <div class="rule" aria-hidden="true"></div>
    </section>

    <nav class="filter-bar" id="filter-bar" aria-label="세대·주제 필터" hidden>
      <span class="filter-label">세대·주제</span>
    </nav>

    <div class="layout">
      <div id="map"></div>
      <div id="detail"><div class="card empty">지도에서 핀을 눌러보세요.</div></div>
    </div>

    <footer>
      <span>© 2026 손으로 부르는 광주 · 청년 ESG 문화실험실</span>
      <span>지도 데이터 © OpenStreetMap contributors · © CARTO</span>
    </footer>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
