<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DESIGN C-2 — EDITORIAL MAP · 손으로 부르는 광주</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  /* ===== C-2 EDITORIAL: 밝은 종이 지도 + 정교한 경계·번호 레이블 + 빗금 선택 + 도록식 패널 ===== */
  :root { --paper:#EFEAE0; --paper2:#E6E0D3; --ink:#1A1612; --muted:#6F675B; --line:rgba(26,22,18,.22); --accent:#B8832F; --panel-w:clamp(400px,36vw,560px); --ease:cubic-bezier(.22,1,.36,1); }
  *{box-sizing:border-box} html,body{height:100%} body{margin:0;background:var(--paper);color:var(--ink);font-family:'Pretendard Variable',Pretendard,sans-serif;font-weight:400;overflow:hidden;-webkit-font-smoothing:antialiased}
  .noanim *{transition:none!important;animation:none!important}
  #map{position:fixed;inset:0;background:var(--paper)}
  /* 타일: 채도 제거 + 밝은 종이 톤, 대비를 낮춰 지형·도로가 경계 뒤로 물러나게 */
  .leaflet-tile-pane{filter:grayscale(1) brightness(1.08) contrast(.72) sepia(.22);opacity:.9}
  .leaflet-container.hit{cursor:pointer}
  .rg{transition:fill-opacity .3s,stroke-width .3s}
  .rg-sel{fill:url(#hatch)!important}
  .leaflet-tooltip.dlabel{background:none;border:0;box-shadow:none;padding:0;font:500 11px/1.2 'Pretendard Variable',sans-serif;letter-spacing:.1em;color:var(--ink);text-align:center;pointer-events:none}
  .leaflet-tooltip.dlabel b{display:block;font-size:9px;letter-spacing:.2em;color:var(--muted);font-weight:500;margin-bottom:2px}
  .leaflet-tooltip.dlabel::before{display:none}
  .leaflet-bar{border:1px solid var(--line);box-shadow:none;border-radius:0}.leaflet-bar a{background:var(--paper);color:var(--ink);border-color:var(--line)}
  .leaflet-control-attribution{background:rgba(239,234,224,.8);color:var(--muted);font-size:10px}

  /* 상단: 도록 머리말 + 지역 선택 */
  .top{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;align-items:flex-start;justify-content:space-between;padding:20px 24px;pointer-events:none;border-bottom:1px solid var(--line);background:linear-gradient(var(--paper) 55%,transparent)}
  .top>*{pointer-events:auto}
  .brand{font-size:10.5px;letter-spacing:.22em;color:var(--muted)}.brand b{display:block;color:var(--ink);font-weight:600;font-size:14px;letter-spacing:.02em;margin-bottom:4px}
  .pill{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px;border:1px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);font:500 11px/1 'Pretendard Variable',sans-serif;letter-spacing:.2em;cursor:pointer}
  .pill:hover{background:var(--ink);color:var(--paper)}.pill:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .pill .plus{font-size:15px;font-weight:500}
  .menu{position:fixed;top:78px;right:24px;z-index:950;width:min(560px,calc(100% - 48px));padding:16px 18px 14px;background:var(--paper);border:1px solid var(--ink)}
  body.panel-open .menu{right:calc(var(--panel-w) + 24px)}
  .menu[hidden]{display:none}
  .menu-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--ink);font-size:10px;letter-spacing:.26em;color:var(--muted)}
  .menu-head button{border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;letter-spacing:.1em}
  .menu-grid{display:grid;grid-template-columns:repeat(2,1fr);column-gap:24px}
  .menu-grid button{display:flex;align-items:center;gap:10px;padding:9px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:400 13px/1 'Pretendard Variable',sans-serif;cursor:pointer;text-align:left}
  .menu-grid button small{font-size:9.5px;letter-spacing:.14em;color:var(--muted);width:22px}.menu-grid button span{flex:1}
  .menu-grid button i{width:7px;height:7px;border-radius:50%}.menu-grid i.has{background:var(--ink)}.menu-grid i.no{border:1px solid var(--muted)}
  .menu-grid button:hover span,.menu-grid button.on span{text-decoration:underline;text-underline-offset:4px}.menu-grid button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  .tip{position:fixed;left:0;top:0;z-index:800;pointer-events:none;padding:5px 10px;background:var(--ink);color:var(--paper);font-size:11.5px;letter-spacing:.06em}.tip[hidden]{display:none}
  .err{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:999;padding:12px 16px;border:1px solid #7A3B3B;background:#fff;font-size:13px}.err[hidden]{display:none}

  /* ---- LAYER 2: 작은 도판(plate) 카드 — 얇은 지시선, 번호, 캡션 ---- */
  .art-wrap{background:none;border:0}
  .art-card{position:absolute;left:0;top:0;width:var(--w);transform:translate(calc(-100% - 34px),calc(-100% - 34px));animation:artin .6s var(--ease) both}
  @keyframes artin{from{opacity:0;transform:translate(calc(-100% - 34px),calc(-100% - 20px))}}
  .art-img{position:relative;width:var(--w);height:var(--h);background:var(--paper2);border:1px solid var(--ink);overflow:hidden}
  .art-img img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.2)}
  .art-ph{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:10px;font-size:9.5px;line-height:1.6;letter-spacing:.1em;color:var(--muted);background:repeating-linear-gradient(135deg,rgba(26,22,18,.06) 0 6px,transparent 6px 12px)}
  .art-ph b{display:block;color:var(--ink);font-weight:500;font-size:11px;letter-spacing:.04em}.art-ph small{font-size:9px}
  .art-card.ph .art-ph,.art-img.failed .art-ph{display:grid}.art-img.failed img{display:none}
  .art-card figcaption{display:flex;justify-content:space-between;gap:8px;margin:6px 0 0;font-size:9.5px;letter-spacing:.14em;color:var(--muted);white-space:nowrap}.art-no{color:var(--ink);font-weight:500}
  .art-leader{position:absolute;left:100%;top:100%;width:34px;height:34px;border-right:1px solid var(--ink);border-bottom:0;transform:translate(0,0)}
  .art-leader::after{content:'';position:absolute;right:-1px;bottom:0;width:34px;height:1px;background:var(--ink)}
  .art-dot{position:absolute;left:calc(100% + 34px);top:calc(100% + 34px);width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--ink)}

  /* ---- LAYER 3: 종이 패널, 도록 항목처럼 ---- */
  .panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);z-index:1000;overflow-y:auto;padding:0 32px 60px;background:var(--paper);border-left:1px solid var(--ink);transform:translateX(100%);transition:transform .32s var(--ease)}
  .panel.on{transform:none}.panel[hidden]{display:none}
  .p-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:20px 0 14px;background:var(--paper);border-bottom:1px solid var(--ink);margin:0 -32px;padding-left:24px;padding-right:24px}
  .p-nav{display:flex;gap:8px}
  .circ{width:44px;height:44px;border:1px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer}.circ svg{width:18px;height:18px}.circ:hover{background:var(--ink);color:var(--paper)}.circ:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .p-kicker{margin:30px 0 0;font-size:10px;letter-spacing:.3em;color:var(--muted)}
  .p-idx{display:block;margin:6px 0 0;font-size:64px;font-weight:200;letter-spacing:-.02em;line-height:1;color:var(--ink)}.p-idx b{font-weight:200}
  .p-title{margin:8px 0 0;display:block}
  .p-title b{display:block;font-size:clamp(72px,7.6vw,112px);font-weight:800;letter-spacing:-.05em;line-height:1}.p-title span{display:block;margin-top:10px;font-size:11px;letter-spacing:.24em;color:var(--muted)}
  /* 세로 영상: 왼쪽 60%, 오른쪽에 메타 열 — 도록의 도판+캡션 구성 */
  #panel-body{display:grid;grid-template-columns:3fr 2fr;column-gap:20px;margin-top:26px;padding-top:22px;border-top:1px solid var(--ink)}
  .vwrap{position:relative;grid-column:1;aspect-ratio:var(--ar,.75);background:#111;overflow:hidden}
  .vwrap video{width:100%;height:100%;object-fit:contain;display:block;background:#111}
  .vwrap.none{display:grid;place-items:center;text-align:center;font-size:10px;letter-spacing:.3em;line-height:2.4;color:#bbb;aspect-ratio:.75}
  .play{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 16px;border:0;border-radius:999px;background:var(--paper);color:var(--ink);font:500 12px/1 'Pretendard Variable',sans-serif;cursor:pointer;white-space:nowrap}
  .play i{width:26px;height:26px;border-radius:50%;background:var(--ink);position:relative}.play i::after{content:'';position:absolute;left:10px;top:7px;border-style:solid;border-width:6px 0 6px 9px;border-color:transparent transparent transparent var(--paper)}
  .play[hidden]{display:none}.play:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .meta{grid-column:2;margin:0;align-self:start}
  .meta div{padding:10px 0;border-bottom:1px solid var(--line)}.meta div:first-child{padding-top:0}
  .meta dt{font-size:9.5px;letter-spacing:.22em;color:var(--muted);margin-bottom:4px}.meta dd{margin:0;font-size:12.5px;line-height:1.5}
  h3{grid-column:1/-1;margin:30px 0 10px;font-size:10px;font-weight:500;letter-spacing:.28em;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
  .parts{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}.part{padding:8px 16px;border:1px solid var(--ink);font-size:15px}.part.jamo{border-style:dashed}.parts i{color:var(--muted);font-style:normal}
  .memo{grid-column:1/-1;padding:12px 0;border-bottom:1px solid var(--line)}.memo b{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:6px}.memo p{margin:0 0 6px;font-size:22px;font-weight:300}.memo small{font-size:10px;letter-spacing:.16em;color:var(--muted)}
  .pending{grid-column:1/-1;color:var(--muted);font-size:14px;margin:0}
  .tags{grid-column:1/-1;display:flex;gap:6px;margin-top:24px}.tags span{padding:5px 12px;border:1px solid var(--line);font-size:11px;color:var(--muted)}
  .pills{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:900;display:flex;gap:0;border:1px solid var(--ink);background:var(--paper);transition:transform .32s var(--ease)}
  body.panel-open .pills{transform:translateX(calc(-50% - var(--panel-w) / 2))}
  .pills span{padding:10px 18px;font-size:12px;letter-spacing:.06em;color:var(--muted);border-right:1px solid var(--line)}.pills span:last-child{border-right:0}.pills span.on{background:var(--ink);color:var(--paper)}

  @media (max-width:767px){
    .top{padding:14px 16px}.brand b{font-size:12px}.brand{font-size:9px}
    .menu{top:66px;right:16px;left:16px;width:auto}body.panel-open .menu{right:16px}
    .art-card{transform:translate(-50%,calc(-100% - 30px))}.art-leader{left:50%;top:100%;width:1px;height:30px;border:0;background:var(--ink)}.art-leader::after{display:none}.art-dot{left:50%;top:calc(100% + 30px)}
    .panel{top:auto;left:0;right:0;width:auto;height:56dvh;border-left:0;border-top:1px solid var(--ink);padding:0 18px calc(26px + env(safe-area-inset-bottom));transform:translateY(100%)}
    .p-head{margin:0 -18px;padding:12px 14px}.p-idx{font-size:40px}.p-title b{font-size:56px}
    #panel-body{grid-template-columns:1fr;row-gap:16px}.meta{grid-column:1}.vwrap{width:min(100%,280px);margin:0 auto}
    .pills{display:none}body.panel-open .leaflet-bottom{bottom:56dvh}
  }
</style>
</head>
<body>
  <div id="map"></div>
  <header class="top">
    <div class="brand"><b>손으로 부르는 광주 — 동구 수어 지명 도록</b>GWANGJU SIGN LANGUAGE · INTERACTIVE ART MAP · DESIGN C-2 EDITORIAL</div>
    <button type="button" class="pill" id="menu-btn" aria-expanded="false" aria-controls="menu">EXPLORE PLACES <span class="plus">+</span></button>
  </header>
  <nav class="menu" id="menu" hidden aria-label="지역 선택"><div class="menu-head"><span>INDEX — 동구 16</span><button type="button" id="menu-close">닫기 ✕</button></div><div class="menu-grid"></div></nav>
  <div class="tip" id="tip" hidden></div><div class="err" id="err" hidden role="alert"></div>
  <aside class="panel" id="panel" hidden aria-label="선택한 지역의 수어 기록">
    <header class="p-head"><div class="p-nav"><button type="button" class="circ" id="p-prev" aria-label="이전 기록"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="circ" id="p-next" aria-label="다음 기록"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><button type="button" class="circ" id="p-close" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></header>
    <p class="p-kicker">광주 동구 수어 지명 기록 · PLATE</p><span class="p-idx"><b id="p-idx"></b></span>
    <h2 class="p-title"><b id="p-name"></b><span id="p-en"></span></h2>
    <div id="panel-body"></div>
  </aside>
  <nav class="pills" aria-hidden="true"><span>아카이브</span><span class="on">지도</span><span>소개</span></nav>
<script>window.CONCEPT = { id:'c2', spotlight:false, hatch:true, labelsAlways:true, bigNameOnMap:false, photoSize:[170,118], selectZoomMax:15,
  base:{ color:'rgba(26,22,18,0.55)', weight:1, fill:'#1A1612', fillOpacity:0.02 }, hover:{ color:'#1A1612', weight:1.5, fillOpacity:0.08 }, selected:{ color:'#1A1612', weight:2.2, fillOpacity:0.1 } };</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="concept.js"></script>
</body>
</html>
